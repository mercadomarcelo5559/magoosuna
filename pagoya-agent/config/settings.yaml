# Configuración editable de Pagoya Agent. Cambia aquí ciudades, giros, horarios y precios.
timezone: America/Monterrey

prospecting:
  # Agrega o quita ciudades libremente.
  cities:
    - Monterrey, Nuevo León
    - San Pedro Garza García, Nuevo León
    - San Nicolás de los Garza, Nuevo León
    - Guadalupe, Nuevo León
    - Apodaca, Nuevo León
    - Santa Catarina, Nuevo León
    - General Escobedo, Nuevo León
    - García, Nuevo León
    - Juárez, Nuevo León
    - Santiago, Nuevo León
    - Saltillo, Coahuila
    - Ramos Arizpe, Coahuila
    - Arteaga, Coahuila
    - Allende, Nuevo León
    - Montemorelos, Nuevo León
    - Cadereyta Jiménez, Nuevo León
    - Linares, Nuevo León
  # giro: términos de búsqueda en Google Places
  categories:
    natación: ["academia de natación", "escuela de natación"]
    idiomas: ["escuela de idiomas", "academia de inglés"]
    música: ["academia de música", "escuela de música"]
    artes marciales: ["academia de artes marciales", "escuela de karate", "taekwondo", "jiu jitsu"]
    gimnasia: ["escuela de gimnasia", "gimnasia artística"]
    guardería: ["guardería", "estancia infantil"]
    gimnasio: ["gimnasio"]
    crossfit: ["crossfit"]
    box: ["box gimnasio boxeo"]
    pilates: ["estudio de pilates"]
    yoga: ["estudio de yoga"]
    baile: ["academia de baile para adultos", "escuela de baile"]
    pádel y tenis: ["club de pádel", "academia de tenis"]
  max_pages_per_query: 3        # Places devuelve hasta 20 por página
  min_reviews: 0

whatsapp:
  invitations_per_slot: 60       # cuenta solo ENTREGADOS
  slots:                         # lunes a viernes
    morning: {start: "10:00", end: "13:30"}
    afternoon: {start: "16:00", end: "19:00"}
  send_chunk: 15                 # cuántos envía por ronda (se recalcula cada 10 min)
  pending_grace_minutes: 20      # un envío sin estatus se cuenta como "pendiente" este tiempo
  followup_after_days: 3
  quality_factor: {GREEN: 1.0, YELLOW: 0.5, RED: 0.0, UNKNOWN: 1.0}
  templates:
    invitation: invitacion_pagoya
    followup: seguimiento_pagoya
    calculator: resultado_calculadora
    referral_invite: invita_referidos
    review_request: pide_resena
    demo_reminder: recordatorio_demo
  template_language: es_MX

demos:
  days: [0, 1, 2, 3, 4, 5]       # lunes=0 ... sábado=5
  start: "10:00"
  end: "18:00"
  duration_minutes: 30
  min_notice_hours: 3
  days_ahead: 7

pricing:
  # Precio mensual, IVA incluido. Pago anual = 10 meses (2 gratis).
  plans:
    - {name: Básico, min: 1, max: 40, monthly: 399}
    - {name: Estándar, min: 41, max: 100, monthly: 799}
    - {name: Pro, min: 101, max: 200, monthly: 1199}
    - {name: Plus, min: 201, max: 400, monthly: 1799}
    - {name: Empresa, min: 401, max: null, monthly: 2499, from: true}
  annual_free_months: 2

social:
  post_days: [0, 2, 4, 5]        # lunes, miércoles, viernes, sábado
  post_time: "12:30"
  story_time: "18:00"
  calendar_send: {weekday: 6, time: "10:00"}      # domingo
  calendar_deadline: {weekday: 0, time: "09:00"}  # lunes 9:00

referrals:
  invite_after_days: 30
  referrer_reward_months: 1
  referee_discount_percent: 50

reviews:
  ask_after_days: 15

cold_email:
  daily_limit: 50
  followup_after_days: 4
  send_window: {start: "09:00", end: "14:00"}

seo:
  blog_posts_per_week: 2
  blog_days: [1, 3]              # martes y jueves

report:
  time: "19:00"
