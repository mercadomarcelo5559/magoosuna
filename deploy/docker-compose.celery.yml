# ---------------------------------------------------------------------------
#  Ampliación OPCIONAL: separa la publicación en workers Celery + Redis.
#  Sólo hace falta si un único servicio se queda corto.
#
#  Uso:
#    docker compose -f deploy/docker-compose.prod.yml \
#                   -f deploy/docker-compose.celery.yml up -d
#
#  La lógica de negocio no cambia: sólo el modo de ejecución.
# ---------------------------------------------------------------------------
services:
  redis:
    image: redis:7-alpine
    restart: always
    command: redis-server --save 60 1 --maxmemory 256mb --maxmemory-policy noeviction
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  api:
    environment:
      PUBLISH_MODE: celery
      SCHEDULER_IN_PROCESS: "false"
      REDIS_URL: redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy

  worker:
    image: social-video-api:latest
    restart: always
    env_file: ../.env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-svapi}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-social_video_api}
      REDIS_URL: redis://redis:6379/0
      PUBLISH_MODE: celery
      SCHEDULER_IN_PROCESS: "false"
      ENVIRONMENT: production
      LOG_JSON: "true"
    volumes:
      - media_data:/app/data/media
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.workers.celery_app inspect ping -d celery@$$HOSTNAME || exit 1"]
      interval: 60s
      timeout: 15s
      retries: 3
      start_period: 40s
    command: celery -A app.workers.celery_app worker --loglevel=info --concurrency=2

  beat:
    image: social-video-api:latest
    restart: always
    env_file: ../.env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-svapi}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-social_video_api}
      REDIS_URL: redis://redis:6379/0
      PUBLISH_MODE: celery
      SCHEDULER_IN_PROCESS: "false"
      ENVIRONMENT: production
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'celery.*beat' > /dev/null || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    command: ["celery", "-A", "app.workers.celery_app", "beat", "--loglevel=info", "--schedule=/tmp/celerybeat-schedule"]

volumes:
  redis_data:
