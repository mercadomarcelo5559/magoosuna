name: Process viral clip

on:
  repository_dispatch:
    types: [process-clip]

jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          # yt-dlp-ejs (the YouTube JS-challenge solver) marks Node 20 as
          # unsupported — without a supported runtime, extraction silently
          # degrades and YouTube demands a sign-in/bot check. Node 22+ is
          # required.
          node-version: "22"

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fontconfig

      - name: Install Poppins font
        run: |
          mkdir -p ~/.fonts
          cp worker/fonts/Poppins-ExtraBold.ttf ~/.fonts/
          fc-cache -f

      # Caches the faster-whisper model weights (~500MB download otherwise
      # repeated on every single job) across workflow runs.
      - name: Cache Whisper model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-small-model-v1

      - name: Install Python dependencies
        run: pip install --break-system-packages -U "yt-dlp[default]" faster-whisper

      - name: Restore YouTube cookies
        run: echo "${{ secrets.YOUTUBE_COOKIES_B64 }}" | base64 -d > /tmp/youtube_cookies.txt

      # Caches the built PO-token-provider server so each job skips
      # re-cloning and re-compiling it (git clone + npm ci + tsc) every time.
      - name: Cache PO token provider build
        uses: actions/cache@v4
        id: bgutil-cache
        with:
          path: /tmp/bgutil
          key: bgutil-provider-v1

      - name: Set up PO token provider
        run: |
          if [ ! -d /tmp/bgutil/server/build ]; then
            git clone --depth 1 https://github.com/Brainicism/bgutil-ytdlp-pot-provider /tmp/bgutil
            cd /tmp/bgutil/server
            npm ci
            npx tsc
          fi
          cd /tmp/bgutil/server
          nohup node build/main.js > /tmp/bgutil.log 2>&1 &
          sleep 3

      - name: Process clip
        env:
          VIDEO_URL: ${{ github.event.client_payload.videoUrl }}
          START_SECONDS: ${{ github.event.client_payload.startSeconds }}
          END_SECONDS: ${{ github.event.client_payload.endSeconds }}
          MOMENT_TITLE: ${{ github.event.client_payload.title }}
          ANALYSIS_ID: ${{ github.event.client_payload.analysisId }}
          MOMENT_INDEX: ${{ github.event.client_payload.momentIndex }}
          CONVEX_INGEST_URL: ${{ secrets.CONVEX_INGEST_URL }}
          INGEST_SECRET: ${{ secrets.INGEST_SECRET }}
          WATERMARK_TEXT: "@viralclips2026_"
        run: python3 worker/process_clip.py
