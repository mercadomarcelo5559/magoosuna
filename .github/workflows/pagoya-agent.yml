name: Pagoya Agent

on:
  push:
    paths: ["pagoya-agent/**", ".github/workflows/pagoya-agent.yml"]
  pull_request:
    paths: ["pagoya-agent/**"]
  schedule:
    - cron: "*/30 * * * *"   # vigila que el servidor esté vivo; si falla, GitHub te manda correo
  workflow_dispatch:

jobs:
  tests:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pagoya-agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m pytest -q

  health:
    if: github.event_name == 'schedule' && vars.PAGOYA_URL != ''
    runs-on: ubuntu-latest
    steps:
      - name: Servidor vivo
        run: curl -fsS --retry 3 --retry-delay 20 "${{ vars.PAGOYA_URL }}/health"
