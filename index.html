<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Agentes · Canal</title>
<style>
  :root {
    --bg: #0b0f14;
    --panel: #11161d;
    --border: #1f2937;
    --text: #e5e7eb;
    --muted: #6b7280;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    overflow: hidden;
  }
  #app { display: flex; height: 100vh; }

  /* Sidebar */
  #sidebar {
    width: 230px;
    min-width: 230px;
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    padding: 16px 10px;
    overflow-y: auto;
  }
  #sidebar h1 {
    font-size: 12px;
    font-weight: 700;
    color: var(--muted);
    letter-spacing: 0.5px;
    padding: 4px 10px 14px;
    margin: 0;
  }
  .bot-btn {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px;
    border-radius: 10px;
    border: none;
    cursor: pointer;
    text-align: left;
    background: transparent;
    color: var(--muted);
    width: 100%;
    margin-bottom: 4px;
  }
  .bot-btn.active { background: var(--panel); color: #f9fafb; }
  .bot-emoji { font-size: 18px; }
  .bot-name { font-size: 14px; font-weight: 600; display: block; }
  .bot-tag { font-size: 11px; color: var(--muted); display: block; }

  #sidebar-footer {
    margin-top: auto;
    padding: 10px;
    font-size: 12px;
    color: var(--muted);
    cursor: pointer;
    border-top: 1px solid var(--border);
    padding-top: 14px;
  }

  /* Main */
  #main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  #header {
    padding: 14px 20px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 10px;
  }
  #header .name { font-size: 15px; font-weight: 700; }
  #header .tag { font-size: 12px; color: var(--muted); }

  #messages { flex: 1; overflow-y: auto; padding: 20px; }
  .empty-state { color: #4b5563; font-size: 13px; text-align: center; margin-top: 40px; }
  .msg-row { display: flex; margin-bottom: 12px; }
  .msg-row.user { justify-content: flex-end; }
  .msg-row.assistant { justify-content: flex-start; }
  .bubble {
    max-width: 75%;
    padding: 10px 14px;
    border-radius: 14px;
    font-size: 14px;
    line-height: 1.5;
    white-space: pre-wrap;
  }
  .bubble.user { color: #0b0f14; font-weight: 500; }
  .bubble.assistant { background: var(--panel); color: var(--text); }
  .typing { padding: 10px 14px; border-radius: 14px; font-size: 14px; background: var(--panel); color: var(--muted); }

  #input-bar { padding: 14px 20px; border-top: 1px solid var(--border); display: flex; gap: 10px; }
  #input-bar textarea {
    flex: 1; resize: none; background: var(--panel); border: 1px solid var(--border);
    border-radius: 10px; padding: 10px 14px; color: var(--text); font-size: 14px; outline: none;
    font-family: inherit;
  }
  #send-btn {
    color: #0b0f14; border: none; border-radius: 10px; padding: 0 20px;
    font-weight: 700; font-size: 14px; cursor: pointer;
  }
  #send-btn:disabled { opacity: 0.5; cursor: not-allowed; }

  /* Modal */
  #modal-overlay {
    display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6);
    align-items: center; justify-content: center; z-index: 10;
  }
  #modal {
    background: var(--panel); border: 1px solid var(--border); border-radius: 14px;
    padding: 24px; width: 360px; max-width: 90vw;
  }
  #modal h2 { font-size: 15px; margin: 0 0 6px; }
  #modal p { font-size: 12px; color: var(--muted); margin: 0 0 14px; line-height: 1.5; }
  #modal input {
    width: 100%; background: var(--bg); border: 1px solid var(--border); border-radius: 8px;
    padding: 10px 12px; color: var(--text); font-size: 13px; margin-bottom: 14px; outline: none;
  }
  #modal-buttons { display: flex; justify-content: flex-end; gap: 10px; }
  #modal-buttons button {
    padding: 8px 16px; border-radius: 8px; border: none; font-size: 13px; font-weight: 600; cursor: pointer;
  }
  #modal-cancel { background: transparent; color: var(--muted); }
  #modal-save { background: #22c55e; color: #0b0f14; }
</style>
</head>
<body>

<div id="app">
  <div id="sidebar">
    <h1>AGENTES · CANAL</h1>
    <div id="bot-list"></div>
    <div id="sidebar-footer" onclick="openApiKeyModal()">⚙️ Configurar API key</div>
  </div>

  <div id="main">
    <div id="header">
      <span id="header-emoji" style="font-size:20px;"></span>
      <div>
        <div class="name" id="header-name"></div>
        <div class="tag" id="header-tag"></div>
      </div>
    </div>
    <div id="messages"></div>
    <div id="input-bar">
      <textarea id="input" rows="1" placeholder="Escribe un mensaje..."></textarea>
      <button id="send-btn">Enviar</button>
    </div>
  </div>
</div>

<div id="modal-overlay">
  <div id="modal">
    <h2>API key de Anthropic</h2>
    <p>Se guarda solo en este navegador (localStorage), nunca sale de tu equipo salvo para llamar a la API de Anthropic directamente. No compartas esta página públicamente con tu key configurada.</p>
    <input id="api-key-input" type="password" placeholder="sk-ant-..." />
    <div id="modal-buttons">
      <button id="modal-cancel">Cancelar</button>
      <button id="modal-save">Guardar</button>
    </div>
  </div>
</div>

<script>
const BOTS = [
  {
    id: "guion",
    name: "Guionista",
    emoji: "✍️",
    color: "#22c55e",
    tagline: "Escribe guiones estilo MONEY IQ",
    system: `Eres un guionista experto en videos de finanzas/economía estilo el canal MONEY IQ, en español, para un canal faceless.
Tu trabajo: escribir guiones de 6-10 minutos con gancho fuerte en los primeros 15 segundos, estructura clara (problema -> explicación -> ejemplo -> conclusión), lenguaje simple pero autoritativo, y llamadas a la acción naturales.
Marca cada sección con [GANCHO], [DESARROLLO], [EJEMPLO], [CIERRE]. Sé directo, entrega guiones listos para grabar, no expliques teoría a menos que se te pida.`,
  },
  {
    id: "investigacion",
    name: "Investigador",
    emoji: "🔍",
    color: "#3b82f6",
    tagline: "Datos, cifras y fuentes",
    system: `Eres un investigador de datos financieros y económicos para un canal de YouTube en español.
Tu trabajo: dar datos concretos, cifras, estadísticas y ejemplos reales que sirvan como base para guiones.
Cuando cites una fuente, sé claro sobre qué tipo de fuente es (informe, reporte, dato histórico conocido).
Sé conciso, entrega la información en listas o bullets fáciles de copiar a un guion. No expliques de más.`,
  },
  {
    id: "seo",
    name: "SEO & Títulos",
    emoji: "📈",
    color: "#f59e0b",
    tagline: "Títulos, descripciones, tags",
    system: `Eres un experto en SEO de YouTube para canales de finanzas en español estilo MONEY IQ.
Tu trabajo: generar títulos con alto CTR (con curiosidad/beneficio claro), descripciones optimizadas con keywords, y listas de tags.
Siempre entrega 5 opciones de título, 1 descripción lista para pegar, y 10-15 tags. Directo, sin relleno.`,
  },
  {
    id: "miniaturas",
    name: "Miniaturas",
    emoji: "🎨",
    color: "#a855f7",
    tagline: "Conceptos visuales de thumbnail",
    system: `Eres un diseñador de miniaturas (thumbnails) para YouTube, especializado en canales de finanzas faceless.
Tu trabajo: describir conceptos visuales de miniatura listos para pasar a un generador de imágenes o diseñador: composición, texto en pantalla (máximo 4-5 palabras, alto contraste), colores, elementos gráficos (gráficas, íconos de dinero, flechas).
Entrega 3 conceptos por petición, en formato de prompt de imagen + texto sugerido. Directo, sin teoría de diseño.`,
  },
  {
    id: "edicion",
    name: "Editor de Video",
    emoji: "🎬",
    color: "#ef4444",
    tagline: "Ritmo, cortes, B-roll",
    system: `Eres un editor de video experto en canales faceless de finanzas en español.
Tu trabajo: dado un guion o idea, dar indicaciones de edición: dónde cortar, qué B-roll o gráficas usar, ritmo (rápido/lento), música sugerida, y dónde poner texto en pantalla o efectos.
Responde en formato de lista con timestamps aproximados. Directo, sin explicaciones largas.`,
  },
];

const HISTORY_PREFIX = "agentes_canal_history_";
const API_KEY_STORAGE = "agentes_canal_api_key";

let activeBotId = BOTS[0].id;
let loading = false;

function loadHistory(botId) {
  try {
    const raw = localStorage.getItem(HISTORY_PREFIX + botId);
    return raw ? JSON.parse(raw) : [];
  } catch (e) {
    return [];
  }
}
function saveHistory(botId, msgs) {
  localStorage.setItem(HISTORY_PREFIX + botId, JSON.stringify(msgs));
}
function getApiKey() {
  return localStorage.getItem(API_KEY_STORAGE) || "";
}
function setApiKey(key) {
  localStorage.setItem(API_KEY_STORAGE, key);
}

function renderSidebar() {
  const list = document.getElementById("bot-list");
  list.innerHTML = "";
  BOTS.forEach((bot) => {
    const btn = document.createElement("button");
    btn.className = "bot-btn" + (bot.id === activeBotId ? " active" : "");
    if (bot.id === activeBotId) btn.style.boxShadow = `inset 3px 0 0 ${bot.color}`;
    btn.onclick = () => { activeBotId = bot.id; renderAll(); };
    btn.innerHTML = `
      <span class="bot-emoji">${bot.emoji}</span>
      <span>
        <span class="bot-name">${bot.name}</span>
        <span class="bot-tag">${bot.tagline}</span>
      </span>
    `;
    list.appendChild(btn);
  });
}

function renderHeader() {
  const bot = BOTS.find((b) => b.id === activeBotId);
  document.getElementById("header-emoji").textContent = bot.emoji;
  document.getElementById("header-name").textContent = bot.name;
  document.getElementById("header-tag").textContent = bot.tagline;
  document.getElementById("send-btn").style.background = bot.color;
}

function renderMessages() {
  const bot = BOTS.find((b) => b.id === activeBotId);
  const msgs = loadHistory(activeBotId);
  const container = document.getElementById("messages");
  container.innerHTML = "";

  if (msgs.length === 0 && !loading) {
    const empty = document.createElement("div");
    empty.className = "empty-state";
    empty.textContent = `Escríbele al ${bot.name} para empezar.`;
    container.appendChild(empty);
  }

  msgs.forEach((m) => {
    const row = document.createElement("div");
    row.className = "msg-row " + m.role;
    const bubble = document.createElement("div");
    bubble.className = "bubble " + m.role;
    if (m.role === "user") bubble.style.background = bot.color;
    bubble.textContent = m.content;
    row.appendChild(bubble);
    container.appendChild(row);
  });

  if (loading) {
    const row = document.createElement("div");
    row.className = "msg-row assistant";
    const bubble = document.createElement("div");
    bubble.className = "typing";
    bubble.textContent = `${bot.name} está escribiendo...`;
    row.appendChild(bubble);
    container.appendChild(row);
  }

  container.scrollTop = container.scrollHeight;
}

function renderAll() {
  renderSidebar();
  renderHeader();
  renderMessages();
}

async function sendMessage() {
  const input = document.getElementById("input");
  const text = input.value.trim();
  if (!text || loading) return;

  const apiKey = getApiKey();
  if (!apiKey) {
    openApiKeyModal();
    return;
  }

  input.value = "";
  const bot = BOTS.find((b) => b.id === activeBotId);
  let msgs = loadHistory(activeBotId);
  msgs = [...msgs, { role: "user", content: text }];
  saveHistory(activeBotId, msgs);
  loading = true;
  renderMessages();

  try {
    const response = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "x-api-key": apiKey,
        "anthropic-version": "2023-06-01",
        "anthropic-dangerous-direct-browser-access": "true",
      },
      body: JSON.stringify({
        model: "claude-sonnet-4-6",
        max_tokens: 1200,
        system: bot.system,
        messages: msgs.map((m) => ({ role: m.role, content: m.content })),
      }),
    });
    const data = await response.json();
    let reply;
    if (data.error) {
      reply = `Error: ${data.error.message || "no se pudo conectar"}`;
    } else {
      const textBlocks = (data.content || []).filter((b) => b.type === "text").map((b) => b.text);
      reply = textBlocks.join("\n") || "(sin respuesta)";
    }
    msgs = [...msgs, { role: "assistant", content: reply }];
    saveHistory(activeBotId, msgs);
  } catch (e) {
    msgs = [...msgs, { role: "assistant", content: "Error de conexión. Revisa tu API key e intenta de nuevo." }];
    saveHistory(activeBotId, msgs);
  } finally {
    loading = false;
    renderMessages();
  }
}

function openApiKeyModal() {
  document.getElementById("api-key-input").value = getApiKey();
  document.getElementById("modal-overlay").style.display = "flex";
}
function closeApiKeyModal() {
  document.getElementById("modal-overlay").style.display = "none";
}

document.getElementById("send-btn").addEventListener("click", sendMessage);
document.getElementById("input").addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
});
document.getElementById("modal-cancel").addEventListener("click", closeApiKeyModal);
document.getElementById("modal-save").addEventListener("click", () => {
  const val = document.getElementById("api-key-input").value.trim();
  setApiKey(val);
  closeApiKeyModal();
});

renderAll();
if (!getApiKey()) {
  openApiKeyModal();
}
</script>

</body>
</html>
